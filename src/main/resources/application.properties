# ================================================
# application.properties
# Event & Program Tracker - Spring Boot Config
# ================================================

# Server
server.port=8080
spring.application.name=event-program-tracker

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.eventtracker=DEBUG
logging.level.org.springframework.web=INFO

# ================================================
# DATABASE CONFIG
# ================================================
spring.datasource.url=jdbc:mysql://localhost:3306/event_tracker_db
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================================================
# MVC DATE / TIME FORMAT
# Required for binding HTML <input type="date"> → LocalDate
# and <input type="time"> → LocalTime in form submissions
# ================================================
spring.mvc.format.date=iso
spring.mvc.format.time=HH:mm

# ================================================
# FILE UPLOAD (event cover images)
# Files are saved to the 'uploads' folder and served at /uploads/**
# ================================================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
