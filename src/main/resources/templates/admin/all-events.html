<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!--
  File: src/main/resources/templates/admin/all-events.html
  Route: GET /admin/events
  Controller: AdminPagesController.allEvents()
  Access: ADMIN role
-->

<head th:replace="~{fragments/head :: head(title='All Events')}"></head>

<body>
<div class="dashboard-layout">

    <div th:replace="~{fragments/sidebar :: sidebar-overlay}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='events', userRole='ADMIN')}"></div>

    <div class="dashboard-main">

        <header th:replace="~{fragments/topbar :: topbar('All Events')}"></header>

        <main class="dashboard-content">

            <div class="dashboard-welcome">
                <h1>All Events 📋</h1>
                <p>Platform-wide view — see every event and which organiser created it.</p>
            </div>

            <!-- Stats (all live) -->
            <div class="stats-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));">
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--primary-50);color:var(--primary);"><i class="bi bi-calendar3"></i></div>
                    <div class="stat-value" th:text="${totalEvents}">0</div>
                    <div class="stat-label">Total Events</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--success-light);color:var(--success);"><i class="bi bi-broadcast"></i></div>
                    <div class="stat-value" th:text="${approvedEventCount}">0</div>
                    <div class="stat-label">Published</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--warning-light);color:var(--warning);"><i class="bi bi-hourglass-split"></i></div>
                    <div class="stat-value" th:text="${pendingEventCount}">0</div>
                    <div class="stat-label">Pending Approval</div>
                </div>
            </div>

            <!-- Table -->
            <div class="dashboard-table mb-5">
                <div class="table-header">
                    <div class="d-flex gap-2 flex-wrap align-items-center">
                        <button class="btn btn-sm btn-primary" onclick="filterAdminEvents(this,'all')">All</button>
                        <button class="btn btn-sm btn-ghost" onclick="filterAdminEvents(this,'active')" style="border:1px solid var(--border-color);">Published</button>
                        <button class="btn btn-sm btn-ghost" onclick="filterAdminEvents(this,'pending')" style="border:1px solid var(--border-color);">Pending</button>
                    </div>
                    <input type="text" class="form-control form-control-sm" placeholder="Search event or organiser..." style="width:220px;" oninput="searchAdminEvents(this.value)"/>
                </div>

                <table class="table-custom" id="adminEventsTable">
                    <thead>
                        <tr>
                            <th>Event</th>
                            <th>Organiser</th>
                            <th>Date</th>
                            <th>Registrations</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="event : ${allPlatformEvents}"
                            th:attr="data-status=${event.approved ? 'active' : 'pending'}">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div style="width:38px;height:38px;border-radius:var(--radius-lg);overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;color:white;">
                                        <img th:if="${event.imageUrl != null and !event.imageUrl.isEmpty()}" th:src="${event.imageUrl}" alt="" style="width:100%;height:100%;object-fit:cover;"/>
                                        <i th:unless="${event.imageUrl != null and !event.imageUrl.isEmpty()}" class="bi bi-calendar-event"></i>
                                    </div>
                                    <div>
                                        <div style="font-weight:var(--font-semibold);font-size:var(--text-sm);" th:text="${event.title}">Title</div>
                                        <span class="badge badge-conference" style="font-size:0.6rem;" th:text="${event.category != null ? event.category : 'General'}">Cat</span>
                                    </div>
                                </div>
                            </td>
                            <td style="font-size:var(--text-sm);color:var(--text-secondary);"
                                th:text="${event.organizer != null ? event.organizer.name : 'Unknown'}">Organiser</td>
                            <td style="font-size:var(--text-sm);"
                                th:text="${event.eventDate != null ? #temporals.format(event.eventDate,'d MMM yyyy') : 'TBA'}">Date</td>
                            <td style="font-size:var(--text-sm);font-weight:var(--font-medium);"
                                th:text="${regCounts[event.id]} + ' / ' + ${event.capacity}">0 / 0</td>
                            <td>
                                <span class="badge badge-success" th:if="${event.approved}">Published</span>
                                <span class="badge badge-warning" th:unless="${event.approved}">Pending</span>
                            </td>
                            <td>
                                <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-ghost" style="border:1px solid var(--border-color);" title="View &amp; leave a note">
                                    <i class="bi bi-eye me-1"></i>View
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(allPlatformEvents)}">
                            <td colspan="6" class="text-center py-4" style="color:var(--text-muted);">No events on the platform yet.</td>
                        </tr>
                    </tbody>
                </table>
                <div class="p-4 border-top">
                    <span style="font-size:var(--text-xs);color:var(--text-muted);" th:text="'Showing ' + ${totalEvents} + ' event(s)'">Showing events</span>
                </div>
            </div>

        </main>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script>
    function filterAdminEvents(btn, status) {
        document.querySelectorAll('.table-header .btn-sm').forEach(b => {
            if (b.getAttribute('onclick') && b.getAttribute('onclick').includes('filterAdminEvents')) {
                b.className = 'btn btn-sm btn-ghost';
                b.style.border = '1px solid var(--border-color)';
            }
        });
        btn.className = 'btn btn-sm btn-primary';
        btn.style.border = '';
        document.querySelectorAll('#adminEventsTable tbody tr').forEach(row => {
            row.style.display = (status === 'all' || row.dataset.status === status) ? '' : 'none';
        });
    }
    function searchAdminEvents(q) {
        const term = q.toLowerCase();
        document.querySelectorAll('#adminEventsTable tbody tr').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
        });
    }
</script>
</body>
</html>
