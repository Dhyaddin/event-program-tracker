<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!--
  File: src/main/resources/templates/admin/manage-users.html
  Route: GET /admin/users
  Controller: AdminPagesController.manageUsers()
  Access: ADMIN role — READ ONLY table of user details.
-->

<head th:replace="~{fragments/head :: head(title='Manage Users')}"></head>

<body>
<div class="dashboard-layout">

    <div th:replace="~{fragments/sidebar :: sidebar-overlay}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='users', userRole='ADMIN')}"></div>

    <div class="dashboard-main">

        <header th:replace="~{fragments/topbar :: topbar('Manage Users')}"></header>

        <main class="dashboard-content">

            <div class="dashboard-welcome">
                <h1>Manage Users 👤</h1>
                <p>View all registered user accounts, their roles and status.</p>
            </div>

            <!-- Stats (live) -->
            <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);">
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--primary-50);color:var(--primary);"><i class="bi bi-people"></i></div>
                    <div class="stat-value" th:text="${totalUsers}">0</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--success-light);color:var(--success);"><i class="bi bi-person-check"></i></div>
                    <div class="stat-value" th:text="${regularUserCount}">0</div>
                    <div class="stat-label">Participants</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--accent-50);color:var(--accent);"><i class="bi bi-megaphone"></i></div>
                    <div class="stat-value" th:text="${organiserCount}">0</div>
                    <div class="stat-label">Organisers</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--danger-light);color:var(--danger);"><i class="bi bi-shield-check"></i></div>
                    <div class="stat-value" th:text="${adminCount}">0</div>
                    <div class="stat-label">Admins</div>
                </div>
            </div>

            <!-- Read-only user table -->
            <div class="dashboard-table mb-5">
                <div class="table-header">
                    <h5>All Users</h5>
                    <input type="text" class="form-control form-control-sm" placeholder="Search name or email..." style="width:220px;" oninput="searchUsers(this.value)"/>
                </div>
                <table class="table-custom" id="usersTable">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Joined</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${allUsers}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="avatar avatar-xs" style="background:var(--primary);color:white;"
                                         th:text="${u.name != null and !u.name.isEmpty() ? u.name.substring(0,1).toUpperCase() : 'U'}">U</div>
                                    <span style="font-weight:var(--font-medium);font-size:var(--text-sm);" th:text="${u.name}">Name</span>
                                </div>
                            </td>
                            <td style="font-size:var(--text-xs);color:var(--text-secondary);" th:text="${u.email}">email</td>
                            <td style="font-size:var(--text-xs);color:var(--text-secondary);" th:text="${u.phone != null ? u.phone : '—'}">phone</td>
                            <td>
                                <span class="badge badge-primary" th:if="${u.role.name() == 'USER'}">User</span>
                                <span class="badge badge-accent"  th:if="${u.role.name() == 'ORGANIZER'}">Organiser</span>
                                <span class="badge badge-danger"  th:if="${u.role.name() == 'ADMIN'}">Admin</span>
                            </td>
                            <td style="font-size:var(--text-xs);color:var(--text-muted);"
                                th:text="${u.createdAt != null ? #temporals.format(u.createdAt,'d MMM yyyy') : '—'}">Joined</td>
                            <td>
                                <span class="badge badge-success" th:if="${u.status == null or u.status.name() == 'APPROVED'}">Active</span>
                                <span class="badge badge-warning"  th:if="${u.status != null and u.status.name() == 'PENDING'}">Pending</span>
                                <span class="badge badge-danger"   th:if="${u.status != null and u.status.name() == 'REJECTED'}">Rejected</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(allUsers)}">
                            <td colspan="6" class="text-center py-4" style="color:var(--text-muted);">No users found.</td>
                        </tr>
                    </tbody>
                </table>
                <div class="p-4 border-top">
                    <span style="font-size:var(--text-xs);color:var(--text-muted);" th:text="'Showing ' + ${totalUsers} + ' user(s)'">Showing users</span>
                </div>
            </div>

        </main>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script>
    function searchUsers(q) {
        const term = q.toLowerCase();
        document.querySelectorAll('#usersTable tbody tr').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
        });
    }
</script>
</body>
</html>
