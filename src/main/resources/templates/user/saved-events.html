<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!--
  File: src/main/resources/templates/user/saved-events.html
  Route: GET /my-saved
  Controller: UserPagesController.savedEvents()
  Access: USER role
-->

<head th:replace="~{fragments/head :: head(title='Saved Events')}"></head>

<body>
<div class="dashboard-layout">

    <div th:replace="~{fragments/sidebar :: sidebar-overlay}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='saved', userRole='USER')}"></div>

    <div class="dashboard-main">

        <header th:replace="~{fragments/topbar :: topbar('Saved Events')}"></header>

        <main class="dashboard-content">

            <div class="dashboard-welcome">
                <h1>Saved Events 🔖</h1>
                <p>Events you've bookmarked to register later.</p>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert" role="alert"
                 style="background:#dcfce7;color:#166534;border:1px solid #bbf7d0;border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-5);">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Done</span>
            </div>

            <!-- Stats -->
            <div class="stats-grid" style="grid-template-columns:repeat(1,minmax(0,260px));margin-bottom:var(--space-8);">
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--primary-50);color:var(--primary);"><i class="bi bi-bookmark-fill"></i></div>
                    <div class="stat-value" th:text="${savedCount}">0</div>
                    <div class="stat-label">Saved Events</div>
                </div>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(savedEvents)}" class="text-center py-5">
                <i class="bi bi-bookmark" style="font-size:3rem;color:var(--text-muted);"></i>
                <h5 class="mt-3" style="color:var(--text-secondary);">No saved events yet</h5>
                <p style="color:var(--text-muted);">Browse events and tap <strong>Save</strong> to bookmark them here.</p>
                <a th:href="@{/events}" class="btn btn-primary btn-sm mt-2"><i class="bi bi-search me-1"></i>Browse Events</a>
            </div>

            <!-- Saved Cards Grid (live data) -->
            <div class="row g-5" th:unless="${#lists.isEmpty(savedEvents)}">

                <div class="col-lg-4 col-md-6" th:each="se : ${savedEvents}">
                    <div class="event-card h-100" style="position:relative;">
                        <div style="height:140px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;color:white;overflow:hidden;">
                            <img th:if="${se.event.imageUrl != null and !se.event.imageUrl.isEmpty()}" th:src="${se.event.imageUrl}" alt=""
                                 style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;"/>
                            <i th:unless="${se.event.imageUrl != null and !se.event.imageUrl.isEmpty()}" class="bi bi-calendar-event"></i>
                            <!-- Remove from saved -->
                            <form th:action="@{/events/{id}/save(id=${se.event.id})}" method="post" class="m-0"
                                  style="position:absolute;top:12px;right:12px;">
                                <button type="submit" title="Remove from saved"
                                        style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:1rem;">
                                    <i class="bi bi-bookmark-fill"></i>
                                </button>
                            </form>
                        </div>
                        <div class="event-card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="badge badge-conference" style="font-size:0.65rem;"
                                      th:text="${se.event.category != null ? se.event.category : 'General'}">Category</span>
                                <span class="badge" style="background:rgba(16,185,129,0.12);color:var(--success);font-size:0.65rem;"
                                      th:text="${se.event.status.name()}">Status</span>
                            </div>
                            <h6 style="font-weight:var(--font-semibold);margin-bottom:var(--space-2);"
                                th:text="${se.event.title}">Event Title</h6>
                            <div style="font-size:var(--text-xs);color:var(--text-muted);display:flex;flex-direction:column;gap:4px;margin-bottom:var(--space-4);">
                                <span><i class="bi bi-calendar3 me-2"></i><span
                                        th:text="${se.event.eventDate != null ? #temporals.format(se.event.eventDate,'d MMM yyyy') : 'TBA'}">Date</span></span>
                                <span><i class="bi bi-geo-alt me-2"></i><span
                                        th:text="${se.event.location != null ? se.event.location : 'Venue TBA'}">Venue</span></span>
                                <span><i class="bi bi-people me-2"></i><span
                                        th:text="${se.event.capacity} + ' capacity'">Capacity</span></span>
                            </div>
                            <a th:href="@{/events/{id}(id=${se.event.id})}" class="btn btn-primary btn-sm w-100">View Event</a>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script>
    function unsaveEvent(btn) {
        const card = btn.closest('.col-lg-4, .col-md-6');
        if (!card) return;
        btn.innerHTML = '<i class="bi bi-bookmark"></i>';
        card.style.transition = 'opacity 0.3s';
        card.style.opacity = '0';
        setTimeout(() => {
            card.remove();
            showComingSoon({ preventDefault:()=>{} }, 'Event removed from saved list.');
        }, 300);
    }
</script>
</body>
</html>
