<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Fragment: navbar
  Usage: <nav th:replace="~{fragments/navbar :: navbar}"></nav>
  Used by: index.html, event-list.html, event-details.html (public pages)
  NOT used on: dashboard pages (those use sidebar instead)
-->
<nav th:fragment="navbar"
     class="navbar navbar-expand-lg sticky-top"
     style="background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); height: var(--navbar-height);
            box-shadow: var(--shadow-xs);">
    <div class="container" style="max-width: var(--container-max);">

        <!-- Brand Logo -->
        <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" th:href="@{/}">
            <div style="width:38px;height:38px;background:linear-gradient(135deg,var(--primary),var(--accent));
                        border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;
                        font-size:1.1rem;">
                🎯
            </div>
            <div>
                <div style="font-size:var(--text-base);font-weight:var(--font-bold);color:var(--text-primary);
                            line-height:1.1;letter-spacing:-0.01em;">EventTracker</div>
                <div style="font-size:0.6rem;color:var(--text-muted);line-height:1;letter-spacing:0.05em;
                            text-transform:uppercase;">Event &amp; Program</div>
            </div>
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler border-0 shadow-none" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <i class="bi bi-list" style="font-size:1.4rem;color:var(--text-primary);"></i>
        </button>

        <!-- Nav Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto d-flex align-items-center gap-1">

                <li class="nav-item">
                    <a class="nav-link fw-medium px-3"
                       style="color:var(--text-secondary);font-size:var(--text-sm);
                              transition:color var(--transition-fast);border-radius:var(--radius-lg);padding-top:0.5rem;padding-bottom:0.5rem;"
                       th:href="@{/}"
                       th:classappend="${currentPage == '/'} ? 'active-nav' : ''">
                        <i class="bi bi-house me-1"></i>Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link fw-medium px-3"
                       style="color:var(--text-secondary);font-size:var(--text-sm);
                              transition:color var(--transition-fast);border-radius:var(--radius-lg);padding-top:0.5rem;padding-bottom:0.5rem;"
                       th:href="@{/events}">
                        <i class="bi bi-calendar-event me-1"></i>Events
                    </a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link fw-medium px-3 dropdown-toggle"
                       style="color:var(--text-secondary);font-size:var(--text-sm);cursor:pointer;
                              border-radius:var(--radius-lg);padding-top:0.5rem;padding-bottom:0.5rem;"
                       data-bs-toggle="dropdown" href="#">
                        <i class="bi bi-grid me-1"></i>Categories
                    </a>
                    <ul class="dropdown-menu border-0 shadow-lg rounded-3 mt-2 py-2"
                        style="min-width:200px;border-radius:var(--radius-xl) !important;">
                        <li><a class="dropdown-item d-flex align-items-center gap-2 py-2 px-4"
                               style="font-size:var(--text-sm);" href="#">
                            <span style="color:var(--cat-conference);">🏛️</span> Conference
                        </a></li>
                        <li><a class="dropdown-item d-flex align-items-center gap-2 py-2 px-4"
                               style="font-size:var(--text-sm);" href="#">
                            <span>🛠️</span> Workshop
                        </a></li>
                        <li><a class="dropdown-item d-flex align-items-center gap-2 py-2 px-4"
                               style="font-size:var(--text-sm);" href="#">
                            <span>📚</span> Seminar
                        </a></li>
                        <li><a class="dropdown-item d-flex align-items-center gap-2 py-2 px-4"
                               style="font-size:var(--text-sm);" href="#">
                            <span>🎉</span> Social
                        </a></li>
                        <li><a class="dropdown-item d-flex align-items-center gap-2 py-2 px-4"
                               style="font-size:var(--text-sm);" href="#">
                            <span>⚽</span> Sports
                        </a></li>
                        <li><hr class="dropdown-divider my-1"/></li>
                        <li><a class="dropdown-item d-flex align-items-center gap-2 py-2 px-4"
                               style="font-size:var(--text-sm);color:var(--primary);font-weight:var(--font-medium);"
                               th:href="@{/events}">
                            View all events →
                        </a></li>
                    </ul>
                </li>

            </ul>

            <!-- Auth Buttons -->
            <div class="navbar-auth d-flex align-items-center gap-2">
                <a th:href="@{/auth/login}"
                   class="btn btn-ghost btn-sm"
                   style="color:var(--text-secondary);">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Sign In
                </a>
                <a th:href="@{/auth/register}"
                   class="btn btn-primary btn-sm">
                    <i class="bi bi-person-plus"></i>
                    Get Started
                </a>
            </div>
        </div>
    </div>
</nav>

<style>
  /* Active nav link highlight */
  .active-nav,
  .nav-link:hover {
    color: var(--primary) !important;
    background: var(--primary-50);
  }
</style>

</html>
