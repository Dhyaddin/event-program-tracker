<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!--
  File: src/main/resources/templates/organiser/my-events.html
  Route: GET /organiser/my-events
  Controller: OrganiserController.myEvents()
  Access: ORGANISER role
-->

<head th:replace="~{fragments/head :: head(title='My Events')}"></head>

<body>
<div class="dashboard-layout">

    <div th:replace="~{fragments/sidebar :: sidebar-overlay}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='my-events', userRole='ORGANISER')}"></div>

    <div class="dashboard-main">

        <header th:replace="~{fragments/topbar :: topbar('My Events')}"></header>

        <main class="dashboard-content">

            <div class="dashboard-welcome">
                <h1>My Events 📅</h1>
                <p>Manage all events you've created. Track registrations and performance.</p>
            </div>

            <!-- Stats (live) -->
            <div class="stats-grid" style="grid-template-columns:repeat(2,minmax(0,260px));">
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--primary-50);color:var(--primary);"><i class="bi bi-calendar3"></i></div>
                    <div class="stat-value" th:text="${totalMyEvents}">0</div>
                    <div class="stat-label">Total Events</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--accent-50);color:var(--accent);"><i class="bi bi-people"></i></div>
                    <div class="stat-value" th:text="${totalRegistrations}">0</div>
                    <div class="stat-label">Total Registrations</div>
                </div>
            </div>

            <!-- Table -->
            <div class="dashboard-table mb-5 mt-5">
                <div class="table-header">
                    <h5>My Events</h5>
                    <div class="d-flex gap-2">
                        <input type="text" class="form-control form-control-sm" placeholder="Search events..." style="width:200px;" oninput="searchEvents(this.value)"/>
                        <a th:href="@{/events/create}" th:unless="${isPendingOrganiser}" class="btn btn-primary btn-sm d-none d-md-flex align-items-center gap-1"><i class="bi bi-plus-circle"></i>New</a>
                    </div>
                </div>

                <!-- SECTION FOR BACKEND/DATABASE — th:each="event : ${myEvents}" -->
                <table class="table-custom" id="eventsTable">
                    <thead>
                        <tr>
                            <th>Event</th>
                            <th>Date</th>
                            <th>Registrations</th>
                            <th>Fill Rate</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="event : ${myEvents}">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div style="width:40px;height:40px;border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;color:white;">
                                        <i class="bi bi-calendar-event"></i>
                                    </div>
                                    <div>
                                        <div style="font-weight:var(--font-semibold);font-size:var(--text-sm);" th:text="${event.title}">Title</div>
                                        <span class="badge badge-conference" style="font-size:0.6rem;" th:text="${event.category != null ? event.category : 'General'}">Cat</span>
                                    </div>
                                </div>
                            </td>
                            <td style="font-size:var(--text-sm);" th:text="${event.eventDate != null ? #temporals.format(event.eventDate,'d MMM yyyy') : 'TBA'}">Date</td>
                            <td><div style="font-size:var(--text-sm);font-weight:var(--font-medium);" th:text="${regCounts[event.id]} + ' / ' + ${event.capacity}">0 / 0</div></td>
                            <td>
                                <div style="display:flex;align-items:center;gap:8px;" th:with="rate=${event.capacity > 0 ? (regCounts[event.id] * 100 / event.capacity) : 0}">
                                    <div style="flex:1;height:6px;background:var(--bg-tertiary);border-radius:3px;overflow:hidden;">
                                        <div style="height:100%;background:var(--primary);border-radius:3px;" th:style="'width:' + ${rate} + '%'"></div>
                                    </div>
                                    <span style="font-size:var(--text-xs);color:var(--text-muted);white-space:nowrap;" th:text="${rate} + '%'">0%</span>
                                </div>
                            </td>
                            <td>
                                <span class="badge badge-success" th:if="${event.status.name() == 'UPCOMING' or event.status.name() == 'ONGOING'}" th:text="${event.status}">Active</span>
                                <span class="badge" style="background:rgba(107,114,128,0.12);color:var(--text-muted);" th:if="${event.status.name() == 'COMPLETED'}">Completed</span>
                                <span class="badge" style="background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2);" th:if="${event.status.name() == 'CANCELLED'}">Cancelled</span>
                            </td>
                            <td>
                                <div class="d-flex gap-1">
                                    <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-icon btn-sm btn-ghost" title="View"><i class="bi bi-eye"></i></a>
                                    <a th:href="@{/events/{id}/edit(id=${event.id})}" class="btn btn-icon btn-sm btn-ghost" title="Edit"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/organiser/registrations}" class="btn btn-icon btn-sm btn-ghost" title="View Registrations"><i class="bi bi-people"></i></a>
                                    <form th:action="@{/events/{id}/delete(id=${event.id})}" method="post"
                                          onsubmit="return confirm('Delete this event and all its registrations?');" class="m-0">
                                        <button type="submit" class="btn btn-icon btn-sm btn-ghost" style="color:var(--danger);" title="Delete"><i class="bi bi-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(myEvents)}">
                            <td colspan="6" class="text-center py-4" style="color:var(--text-muted);">You haven't created any events yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script>
    function filterEvents(btn, status) {
        document.querySelectorAll('.dashboard-table .btn-sm').forEach(b => {
            if (b.getAttribute('onclick') && b.getAttribute('onclick').includes('filterEvents')) {
                b.className = 'btn btn-sm btn-ghost';
                b.style.border = '1px solid var(--border-color)';
            }
        });
        btn.className = 'btn btn-sm btn-primary';
        btn.style.border = '';
        document.querySelectorAll('#eventsTable tbody tr').forEach(row => {
            row.style.display = (status === 'all' || row.dataset.status === status) ? '' : 'none';
        });
    }
    function searchEvents(q) {
        const term = q.toLowerCase();
        document.querySelectorAll('#eventsTable tbody tr').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
        });
    }
</script>
</body>
</html>
