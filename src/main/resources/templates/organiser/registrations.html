<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!--
  File: src/main/resources/templates/organiser/registrations.html
  Route: GET /organiser/registrations
  Controller: OrganiserController.registrations()
  Access: ORGANISER role
-->

<head th:replace="~{fragments/head :: head(title='Registrations')}"></head>

<body>
<div class="dashboard-layout">

    <div th:replace="~{fragments/sidebar :: sidebar-overlay}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='registrations', userRole='ORGANISER')}"></div>

    <div class="dashboard-main">

        <header th:replace="~{fragments/topbar :: topbar('Registrations')}"></header>

        <main class="dashboard-content">

            <div class="dashboard-welcome">
                <h1>Registrations 👥</h1>
                <p>Everyone who registered across your events.</p>
            </div>

            <!-- Stat (live) -->
            <div class="stats-grid" style="grid-template-columns:repeat(1,minmax(0,260px));">
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--primary-50);color:var(--primary);"><i class="bi bi-people"></i></div>
                    <div class="stat-value" th:text="${totalRegistrations}">0</div>
                    <div class="stat-label">Total Registrations</div>
                </div>
            </div>

            <!-- Table -->
            <div class="dashboard-table mb-5 mt-5">
                <div class="table-header">
                    <h5>All Registrations</h5>
                    <input type="text" class="form-control form-control-sm" placeholder="Search name or email..." style="width:220px;" oninput="searchRegs(this.value)"/>
                </div>
                <table class="table-custom" id="regsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Attendee</th>
                            <th>Event</th>
                            <th>Registered</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reg, iter : ${allRegistrations}">
                            <td style="font-size:var(--text-xs);color:var(--text-muted);" th:text="${iter.count}">1</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="avatar avatar-xs" style="background:var(--primary);color:white;"
                                         th:text="${reg.user != null and reg.user.name != null and !reg.user.name.isEmpty() ? reg.user.name.substring(0,1).toUpperCase() : 'U'}">U</div>
                                    <div>
                                        <div style="font-size:var(--text-sm);font-weight:var(--font-medium);" th:text="${reg.user != null ? reg.user.name : 'Unknown'}">Name</div>
                                        <div style="font-size:var(--text-xs);color:var(--text-muted);" th:text="${reg.user != null ? reg.user.email : ''}">email</div>
                                    </div>
                                </div>
                            </td>
                            <td style="font-size:var(--text-sm);" th:text="${reg.event != null ? reg.event.title : ''}">Event</td>
                            <td style="font-size:var(--text-xs);color:var(--text-muted);"
                                th:text="${reg.registrationDate != null ? #temporals.format(reg.registrationDate,'d MMM yyyy') : ''}">Date</td>
                            <td>
                                <span class="badge badge-success" th:if="${reg.status.name() == 'REGISTERED'}">Confirmed</span>
                                <span class="badge" style="background:rgba(16,185,129,0.12);color:var(--success);border:1px solid rgba(16,185,129,0.25);" th:if="${reg.status.name() == 'ATTENDED'}">Attended</span>
                                <span class="badge" style="background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2);" th:if="${reg.status.name() == 'CANCELLED'}">Cancelled</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(allRegistrations)}">
                            <td colspan="5" class="text-center py-4" style="color:var(--text-muted);">No registrations across your events yet.</td>
                        </tr>
                    </tbody>
                </table>
                <div class="p-4 border-top">
                    <span style="font-size:var(--text-xs);color:var(--text-muted);" th:text="'Showing ' + ${totalRegistrations} + ' registration(s)'">Showing</span>
                </div>
            </div>

        </main>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script>
    function searchRegs(q) {
        const term = q.toLowerCase();
        document.querySelectorAll('#regsTable tbody tr').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
        });
    }
</script>
</body>
</html>
